[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = [".venv"]

[tool.ruff.lint]
# Deliberately excluded:
#   BLE001 - several Plaid/metadata paths intentionally swallow exceptions so a
#            best-effort lookup can never escalate into a failed sync.
#   DTZ011 - date.today() is correct here; Plaid transaction dates are local
#            calendar dates, not instants.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "conftest"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["C408", "RUF001", "UP031"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["plaid_monthly_cashflow", "tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
